name: Deploy Patient App to VPS

on:
  push:
    branches: [main]
    paths:
      - 'patient-mobile-app/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: patient-mobile-app
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build web export
        run: npx expo export --platform web

      - name: Load deploy SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Trust the VPS host key
        run: ssh-keyscan -H 187.127.121.74 >> ~/.ssh/known_hosts

      - name: Sync files to VPS
        run: rsync -avz --delete dist/ root@187.127.121.74:/var/www/medrec-patient/

      - name: DEBUG - diagnose remote shell
        run: ssh root@187.127.121.74 "echo WHOAMI=\$(whoami); echo SHELL=\$SHELL; echo PATH=\$PATH; which chown; which chmod" 2>&1 | tail -60

      - name: DEBUG - chown only
        run: ssh root@187.127.121.74 "chown -R www-data:www-data /var/www/medrec-patient"

      - name: DEBUG - chmod only
        run: ssh root@187.127.121.74 "chmod -R 755 /var/www/medrec-patient"
