<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>MedRec — Your Family's Medical Records, All in One Place</title>
<meta name="description" content="MedRec is a patient-owned health record app for Pakistan. On-device OCR turns lab reports and prescriptions into one private, organized, offline-ready health history for you and your family.">
<link rel="icon" href="logo-icon.png" type="image/png">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Inter:wght@400;500;600;700;800&display=swap');

  :root{
    --bg:#FBFCFA;
    --bg-alt:#F3F6F3;
    --ink:#1A1A1A;
    --ink-soft:#454B49;
    --muted:#6B7370;
    --card:#FFFFFF;
    --border:#E6E7E1;
    --teal:#2DA6B2;
    --green:#33B15E;
    --grad:linear-gradient(135deg,#2DA6B2 0%,#33B15E 100%);
    --grad-soft:linear-gradient(135deg,rgba(45,166,178,0.10) 0%,rgba(51,177,94,0.10) 100%);
    --ring:#2DA6B2;
    --danger:#C4453A;
    --shadow-sm:0 1px 2px rgba(20,24,22,0.06);
    --shadow-md:0 8px 24px rgba(20,24,22,0.08);
    --shadow-lg:0 24px 60px rgba(20,24,22,0.14);
    --radius:16px;
    --radius-sm:10px;
    --maxw:1180px;
  }
  :root[data-theme="dark"]{
    --bg:#101312;
    --bg-alt:#161A18;
    --ink:#F3F5F3;
    --ink-soft:#C9CFCB;
    --muted:#8D948F;
    --card:#171B19;
    --border:#262B28;
    --grad-soft:linear-gradient(135deg,rgba(45,166,178,0.16) 0%,rgba(51,177,94,0.16) 100%);
    --shadow-sm:0 1px 2px rgba(0,0,0,0.3);
    --shadow-md:0 8px 24px rgba(0,0,0,0.35);
    --shadow-lg:0 24px 60px rgba(0,0,0,0.5);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#101312;
      --bg-alt:#161A18;
      --ink:#F3F5F3;
      --ink-soft:#C9CFCB;
      --muted:#8D948F;
      --card:#171B19;
      --border:#262B28;
      --grad-soft:linear-gradient(135deg,rgba(45,166,178,0.16) 0%,rgba(51,177,94,0.16) 100%);
      --shadow-sm:0 1px 2px rgba(0,0,0,0.3);
      --shadow-md:0 8px 24px rgba(0,0,0,0.35);
      --shadow-lg:0 24px 60px rgba(0,0,0,0.5);
    }
  }

  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    -webkit-font-smoothing:antialiased;
    line-height:1.55;
  }
  h1,h2,h3,h4{
    font-family:'Playfair Display',Georgia,serif;
    font-weight:600;
    line-height:1.15;
    margin:0 0 .5em;
    letter-spacing:-0.01em;
  }
  p{margin:0 0 1em; color:var(--ink-soft);}
  a{color:inherit;text-decoration:none;}
  img{max-width:100%;display:block;}
  button{font-family:inherit;}
  ::selection{background:rgba(45,166,178,0.25);}

  .wrap{max-width:var(--maxw); margin:0 auto; padding-inline:24px;}
  @media (max-width:640px){ .wrap{padding-inline:20px;} }

  .grad-text{
    background:var(--grad);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
  }

  /* ---------- Top bar ---------- */
  .topbar{
    position:sticky; top:0; z-index:100;
    background:color-mix(in srgb, var(--bg) 88%, transparent);
    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);
    border-bottom:1px solid var(--border);
  }
  .topbar-inner{
    display:flex; align-items:center; justify-content:space-between;
    padding-block:14px;
    gap:16px;
  }
  .brand{display:flex; align-items:center; gap:10px; cursor:pointer;}
  .brand img{height:34px; width:auto;}
  .brand span{font-family:'Playfair Display',serif; font-weight:700; font-size:19px; letter-spacing:-0.01em;}

  nav.primary-nav{display:flex; align-items:center; gap:2px;}
  nav.primary-nav button.nav-link{
    background:none; border:none; cursor:pointer;
    font-size:14.5px; font-weight:500; color:var(--ink-soft);
    padding:9px 14px; border-radius:999px;
    transition:color .18s ease, background .18s ease;
    white-space:nowrap;
  }
  nav.primary-nav button.nav-link:hover{color:var(--ink); background:var(--bg-alt);}
  nav.primary-nav button.nav-link[aria-current="page"]{color:var(--ink); background:var(--grad-soft); font-weight:600;}

  .topbar-actions{display:flex; align-items:center; gap:10px;}

  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:8px;
    font-size:14.5px; font-weight:600; cursor:pointer;
    padding:11px 20px; border-radius:999px; border:1px solid transparent;
    transition:transform .15s ease, box-shadow .15s ease, background .15s ease, border-color .15s ease, opacity .15s ease;
    min-height:44px; line-height:1;
  }
  .btn:active{transform:scale(0.97);}
  .btn-primary{background:var(--grad); color:#fff; box-shadow:var(--shadow-sm);}
  .btn-primary:hover{box-shadow:var(--shadow-md); transform:translateY(-1px);}
  .btn-ghost{background:transparent; color:var(--ink); border-color:var(--border);}
  .btn-ghost:hover{background:var(--bg-alt);}
  .btn-sm{padding:9px 16px; font-size:13.5px; min-height:38px;}
  .btn-block{width:100%;}
  .btn:focus-visible, button:focus-visible, a:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible{
    outline:2px solid var(--ring); outline-offset:2px;
  }

  .menu-toggle{display:none; background:none; border:1px solid var(--border); border-radius:10px; width:44px; height:44px; align-items:center; justify-content:center; cursor:pointer;}
  .menu-toggle svg{width:20px; height:20px;}

  .mobile-menu{
    display:none; flex-direction:column; gap:2px;
    padding:10px 20px 18px;
    border-bottom:1px solid var(--border);
    background:var(--bg);
  }
  .mobile-menu.open{display:flex;}
  .mobile-menu button.nav-link{
    text-align:left; background:none; border:none; cursor:pointer;
    font-size:15.5px; font-weight:500; color:var(--ink-soft);
    padding:12px 10px; border-radius:10px;
  }
  .mobile-menu button.nav-link[aria-current="page"]{color:var(--ink); background:var(--bg-alt); font-weight:600;}
  .mobile-menu .btn{margin-top:8px;}

  @media (max-width:900px){
    nav.primary-nav{display:none;}
    .menu-toggle{display:flex;}
    .topbar-actions .btn-ghost{display:none;}
  }

  /* ---------- Sections generic ---------- */
  section{padding-block:88px;}
  section.tight{padding-block:64px;}
  @media (max-width:640px){
    section{padding-block:56px;}
    section.tight{padding-block:44px;}
  }
  .eyebrow{
    display:inline-flex; align-items:center; gap:8px;
    font-size:12.5px; font-weight:700; letter-spacing:.06em; text-transform:uppercase;
    color:var(--teal);
    background:var(--grad-soft);
    border:1px solid var(--border);
    padding:6px 14px; border-radius:999px;
    margin-bottom:18px;
  }
  .eyebrow .dot{width:6px; height:6px; border-radius:50%; background:var(--grad);}
  .section-head{max-width:640px; margin-bottom:48px;}
  .section-head.center{margin-inline:auto; text-align:center;}
  .section-head h2{font-size:clamp(28px,4vw,40px);}
  .section-head p{font-size:16.5px;}

  /* ---------- Hero ---------- */
  .hero{
    position:relative;
    padding-block:96px 80px;
    overflow:hidden;
  }
  .hero::before{
    content:"";
    position:absolute; inset:-20% -10% auto -10%; height:620px;
    background:radial-gradient(60% 60% at 30% 20%, rgba(45,166,178,0.16), transparent 70%),
               radial-gradient(50% 50% at 80% 10%, rgba(51,177,94,0.14), transparent 70%);
    pointer-events:none; z-index:0;
  }
  .hero-inner{position:relative; z-index:1; display:grid; grid-template-columns:1.05fr .95fr; gap:56px; align-items:center;}
  @media (max-width:980px){ .hero-inner{grid-template-columns:1fr; gap:44px; text-align:center;} .hero-cta-row{justify-content:center;} .hero-badges{justify-content:center;} }

  .hero h1{font-size:clamp(36px,5.4vw,58px); margin-bottom:.35em;}
  .hero .lede{font-size:18px; max-width:520px;}
  @media (max-width:980px){ .hero .lede{margin-inline:auto;} }

  .hero-cta-row{display:flex; gap:14px; align-items:center; margin-top:28px; flex-wrap:wrap;}
  .hero-badges{display:flex; gap:22px; margin-top:34px; flex-wrap:wrap; align-items:center;}
  .hero-badge{display:flex; align-items:center; gap:9px; font-size:13.5px; color:var(--muted); font-weight:500;}
  .hero-badge svg{width:18px; height:18px; color:var(--teal); flex-shrink:0;}

  .hero-visual{position:relative;}
  .phone-card{
    background:var(--card); border:1px solid var(--border); border-radius:24px;
    box-shadow:var(--shadow-lg); padding:22px; max-width:380px; margin-inline:auto;
    position:relative;
  }
  .phone-card .ph-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:16px;}
  .phone-card .ph-head .who{display:flex; align-items:center; gap:10px;}
  .avatar{width:38px; height:38px; border-radius:50%; background:var(--grad); display:flex; align-items:center; justify-content:center; color:#fff; font-weight:700; font-size:14px; font-family:'Playfair Display',serif;}
  .ph-name{font-size:14px; font-weight:700;}
  .ph-sub{font-size:12px; color:var(--muted);}
  .status-pill{font-size:11px; font-weight:700; color:var(--green); background:rgba(51,177,94,0.12); padding:4px 10px; border-radius:999px;}
  .record-row{
    display:flex; align-items:center; gap:12px;
    padding:12px; border:1px solid var(--border); border-radius:12px; margin-bottom:10px;
    background:var(--bg-alt);
  }
  .record-row .ricon{
    width:38px; height:38px; border-radius:10px; background:var(--grad); flex-shrink:0;
    display:flex; align-items:center; justify-content:center; color:#fff;
  }
  .record-row .ricon svg{width:18px; height:18px;}
  .record-row .rtext{flex:1; min-width:0;}
  .record-row .rtitle{font-size:13.5px; font-weight:600;}
  .record-row .rmeta{font-size:11.5px; color:var(--muted);}
  .record-row .rtag{font-size:10.5px; font-weight:700; color:var(--teal); background:rgba(45,166,178,0.1); padding:3px 8px; border-radius:999px; white-space:nowrap;}
  .float-chip{
    position:absolute; background:var(--card); border:1px solid var(--border); border-radius:14px;
    box-shadow:var(--shadow-md); padding:12px 14px; display:flex; align-items:center; gap:10px;
    font-size:12.5px; font-weight:600;
  }
  .float-chip svg{width:16px; height:16px; color:var(--green);}
  .chip-1{top:-14px; right:-18px;}
  .chip-2{bottom:-16px; left:-22px;}
  @media (max-width:520px){ .float-chip{display:none;} }

  /* ---------- Logos / trust strip ---------- */
  .trust-strip{border-top:1px solid var(--border); border-bottom:1px solid var(--border); background:var(--bg-alt);}
  .trust-strip .wrap{display:flex; align-items:center; justify-content:center; gap:clamp(24px,6vw,64px); flex-wrap:wrap; padding-block:26px;}
  .trust-item{display:flex; align-items:center; gap:10px; color:var(--muted); font-size:13.5px; font-weight:600;}
  .trust-item svg{width:20px; height:20px; color:var(--teal);}

  /* ---------- Stat / problem section ---------- */
  .stat-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:22px;}
  @media (max-width:760px){ .stat-grid{grid-template-columns:1fr;} }
  .stat-card{
    background:var(--card); border:1px solid var(--border); border-radius:var(--radius);
    padding:30px 26px; box-shadow:var(--shadow-sm);
  }
  .stat-card .num{font-family:'Playfair Display',serif; font-size:38px; font-weight:700; margin-bottom:6px;}
  .stat-card .lab{font-size:14.5px; font-weight:600; margin-bottom:8px;}
  .stat-card p{font-size:13.5px; margin-bottom:0;}

  /* ---------- Feature grid ---------- */
  .feature-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:20px;}
  @media (max-width:900px){ .feature-grid{grid-template-columns:repeat(2,1fr);} }
  @media (max-width:620px){ .feature-grid{grid-template-columns:1fr;} }
  .feature-card{
    background:var(--card); border:1px solid var(--border); border-radius:var(--radius);
    padding:28px 24px; box-shadow:var(--shadow-sm);
    transition:box-shadow .2s ease, transform .2s ease, border-color .2s ease;
  }
  .feature-card:hover{box-shadow:var(--shadow-md); transform:translateY(-3px); border-color:transparent;}
  .ficon{
    width:46px; height:46px; border-radius:12px; background:var(--grad);
    display:flex; align-items:center; justify-content:center; color:#fff; margin-bottom:18px;
  }
  .ficon svg{width:23px; height:23px;}
  .feature-card h3{font-size:18px; margin-bottom:8px;}
  .feature-card p{font-size:14px; margin-bottom:0;}

  /* ---------- Steps ---------- */
  .steps{display:grid; grid-template-columns:repeat(4,1fr); gap:20px; counter-reset:step;}
  @media (max-width:900px){ .steps{grid-template-columns:repeat(2,1fr);} }
  @media (max-width:560px){ .steps{grid-template-columns:1fr;} }
  .step-card{position:relative; padding:26px 22px 22px; background:var(--card); border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow-sm);}
  .step-num{
    width:34px; height:34px; border-radius:50%; background:var(--grad); color:#fff;
    display:flex; align-items:center; justify-content:center; font-weight:700; font-size:14px;
    margin-bottom:16px; font-family:'Playfair Display',serif;
  }
  .step-card h3{font-size:16px; margin-bottom:6px;}
  .step-card p{font-size:13.5px; margin-bottom:0;}
  .step-arrow{position:absolute; top:32px; right:-20px; width:20px; color:var(--border);}
  @media (max-width:900px){ .step-arrow{display:none;} }

  /* ---------- Testimonials ---------- */
  .testi-wrap{position:relative; max-width:760px; margin:0 auto;}
  .testi-track{overflow:hidden; border-radius:var(--radius);}
  .testi-slides{display:flex; transition:transform .5s cubic-bezier(.65,0,.35,1);}
  .testi-slide{flex:0 0 100%; padding:4px;}
  .testi-card{
    background:var(--card); border:1px solid var(--border); border-radius:var(--radius);
    padding:36px; box-shadow:var(--shadow-sm); text-align:center;
  }
  .testi-stars{color:var(--green); margin-bottom:16px; display:flex; gap:3px; justify-content:center;}
  .testi-stars svg{width:16px; height:16px;}
  .testi-quote{font-size:17px; color:var(--ink); font-family:'Playfair Display',serif; font-style:italic; font-weight:500; margin-bottom:20px;}
  .testi-person{display:flex; align-items:center; justify-content:center; gap:12px;}
  .testi-person .avatar{width:42px; height:42px;}
  .testi-name{font-size:14px; font-weight:700; text-align:left;}
  .testi-role{font-size:12.5px; color:var(--muted); text-align:left;}
  .testi-controls{display:flex; justify-content:center; gap:10px; margin-top:22px;}
  .testi-dot{width:8px; height:8px; border-radius:50%; background:var(--border); border:none; cursor:pointer; padding:0; transition:background .2s ease, width .2s ease;}
  .testi-dot[aria-current="true"]{background:var(--grad); width:22px; border-radius:5px;}
  .testi-arrow{
    position:absolute; top:50%; transform:translateY(-50%);
    width:42px; height:42px; border-radius:50%; background:var(--card); border:1px solid var(--border);
    display:flex; align-items:center; justify-content:center; cursor:pointer; box-shadow:var(--shadow-sm);
  }
  .testi-arrow svg{width:18px; height:18px;}
  .testi-arrow.prev{left:-56px;}
  .testi-arrow.next{right:-56px;}
  @media (max-width:840px){ .testi-arrow{display:none;} }

  /* ---------- CTA band ---------- */
  .cta-band{
    background:var(--grad); border-radius:28px; padding:56px 40px; text-align:center; color:#fff;
    position:relative; overflow:hidden;
  }
  .cta-band h2{color:#fff; font-size:clamp(26px,3.6vw,36px);}
  .cta-band p{color:rgba(255,255,255,0.9); max-width:520px; margin-inline:auto; font-size:16px;}
  .cta-band .btn-primary{background:#fff; color:var(--ink); box-shadow:0 8px 24px rgba(0,0,0,0.18);}
  .cta-band .btn-primary:hover{transform:translateY(-1px);}
  .cta-band .btn-ghost{border-color:rgba(255,255,255,0.5); color:#fff;}
  .cta-band .btn-ghost:hover{background:rgba(255,255,255,0.12);}
  .cta-actions{display:flex; gap:14px; justify-content:center; margin-top:26px; flex-wrap:wrap;}

  /* ---------- Footer ---------- */
  footer{border-top:1px solid var(--border); background:var(--bg-alt); padding-block:56px 28px;}
  .footer-grid{display:grid; grid-template-columns:1.4fr repeat(3,1fr); gap:40px; margin-bottom:44px;}
  @media (max-width:760px){ .footer-grid{grid-template-columns:1fr 1fr; row-gap:32px;} }
  @media (max-width:480px){ .footer-grid{grid-template-columns:1fr;} }
  .footer-brand{display:flex; align-items:center; gap:10px; margin-bottom:14px;}
  .footer-brand img{height:30px;}
  .footer-brand span{font-family:'Playfair Display',serif; font-weight:700; font-size:18px;}
  .footer-col h4{font-family:'Inter',sans-serif; font-size:13px; font-weight:700; text-transform:uppercase; letter-spacing:.05em; color:var(--ink); margin-bottom:16px;}
  .footer-col ul{list-style:none; padding:0; margin:0; display:flex; flex-direction:column; gap:11px;}
  .footer-col button, .footer-col a{
    background:none; border:none; padding:0; text-align:left; cursor:pointer;
    font-size:14px; color:var(--muted); font-family:'Inter',sans-serif;
    transition:color .15s ease;
  }
  .footer-col button:hover, .footer-col a:hover{color:var(--teal);}
  .footer-bottom{
    display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:14px;
    padding-top:26px; border-top:1px solid var(--border);
    font-size:13px; color:var(--muted);
  }
  .footer-socials{display:flex; gap:10px;}
  .footer-socials a{
    width:36px; height:36px; border-radius:50%; border:1px solid var(--border); background:var(--card);
    display:flex; align-items:center; justify-content:center; transition:border-color .15s ease, color .15s ease;
  }
  .footer-socials a:hover{border-color:var(--teal); color:var(--teal);}
  .footer-socials svg{width:16px; height:16px;}

  /* ---------- Page hero (sub pages) ---------- */
  .page-hero{padding-block:64px 20px; text-align:center;}
  .page-hero .eyebrow{margin-inline:auto;}
  .page-hero h1{font-size:clamp(30px,4.6vw,46px); max-width:760px; margin-inline:auto;}
  .page-hero p{max-width:600px; margin-inline:auto; font-size:16.5px;}

  /* ---------- Cards: table / pricing ---------- */
  .pricing-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:22px; align-items:stretch;}
  @media (max-width:900px){ .pricing-grid{grid-template-columns:1fr; max-width:420px; margin-inline:auto;} }
  .price-card{
    background:var(--card); border:1px solid var(--border); border-radius:var(--radius);
    padding:32px 28px; display:flex; flex-direction:column; box-shadow:var(--shadow-sm); position:relative;
  }
  .price-card.featured{border:2px solid var(--teal); box-shadow:var(--shadow-lg); transform:translateY(-6px);}
  @media (max-width:900px){ .price-card.featured{transform:none;} }
  .price-badge{
    position:absolute; top:-13px; left:50%; transform:translateX(-50%);
    background:var(--grad); color:#fff; font-size:11.5px; font-weight:700; padding:5px 14px; border-radius:999px;
    letter-spacing:.03em;
  }
  .price-plan{font-size:14px; font-weight:700; color:var(--teal); text-transform:uppercase; letter-spacing:.04em; margin-bottom:6px;}
  .price-amt{font-family:'Playfair Display',serif; font-size:40px; font-weight:700; margin-bottom:4px;}
  .price-amt sup{font-size:16px; font-weight:600; top:-14px; position:relative;}
  .price-per{font-size:13px; color:var(--muted); margin-bottom:20px;}
  .price-desc{font-size:13.5px; margin-bottom:22px;}
  .price-list{list-style:none; padding:0; margin:0 0 26px; display:flex; flex-direction:column; gap:12px; flex:1;}
  .price-list li{display:flex; align-items:flex-start; gap:10px; font-size:13.8px; color:var(--ink-soft);}
  .price-list svg{width:17px; height:17px; color:var(--green); flex-shrink:0; margin-top:2px;}

  /* ---------- Values / about ---------- */
  .value-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:20px;}
  @media (max-width:700px){ .value-grid{grid-template-columns:1fr;} }
  .value-card{display:flex; gap:16px; padding:24px; background:var(--card); border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow-sm);}
  .value-card .ficon{margin-bottom:0; flex-shrink:0;}
  .value-card h3{font-size:16px; margin-bottom:6px;}
  .value-card p{font-size:13.8px; margin-bottom:0;}

  .split{display:grid; grid-template-columns:1fr 1fr; gap:56px; align-items:center;}
  @media (max-width:860px){ .split{grid-template-columns:1fr; gap:32px;} }
  .split img, .split .imgbox{border-radius:var(--radius); border:1px solid var(--border); box-shadow:var(--shadow-md);}
  .imgbox{background:var(--card); padding:34px; display:flex; align-items:center; justify-content:center;}
  .imgbox img{max-width:220px;}

  .founder-card{
    display:flex; gap:20px; align-items:center; background:var(--card); border:1px solid var(--border);
    border-radius:var(--radius); padding:26px; box-shadow:var(--shadow-sm); max-width:520px; margin-inline:auto;
  }
  .founder-avatar{
    width:64px; height:64px; border-radius:50%; background:var(--grad); flex-shrink:0;
    display:flex; align-items:center; justify-content:center; color:#fff; font-family:'Playfair Display',serif;
    font-weight:700; font-size:22px;
  }
  .founder-card h3{font-size:16px; margin-bottom:2px;}
  .founder-card .role{font-size:13px; color:var(--teal); font-weight:600; margin-bottom:8px;}
  .founder-card p{font-size:13.5px; margin-bottom:0;}

  /* ---------- Contact ---------- */
  .contact-grid{display:grid; grid-template-columns:.9fr 1.1fr; gap:48px; align-items:start;}
  @media (max-width:900px){ .contact-grid{grid-template-columns:1fr; gap:36px;} }
  .contact-info-card{background:var(--card); border:1px solid var(--border); border-radius:var(--radius); padding:30px; box-shadow:var(--shadow-sm);}
  .contact-row{display:flex; gap:14px; align-items:flex-start; padding-block:14px; border-bottom:1px solid var(--border);}
  .contact-row:last-child{border-bottom:none;}
  .contact-row .ficon{width:38px; height:38px; margin-bottom:0;}
  .contact-row .ficon svg{width:18px; height:18px;}
  .contact-row .ctitle{font-size:13.5px; font-weight:700; margin-bottom:2px;}
  .contact-row .csub{font-size:13px; color:var(--muted);}

  .form-card{background:var(--card); border:1px solid var(--border); border-radius:var(--radius); padding:32px; box-shadow:var(--shadow-sm);}
  .form-row{display:grid; grid-template-columns:1fr 1fr; gap:16px;}
  @media (max-width:520px){ .form-row{grid-template-columns:1fr;} }
  .field{margin-bottom:18px;}
  .field label{display:block; font-size:13px; font-weight:600; margin-bottom:7px;}
  .field .req{color:var(--danger);}
  .field input, .field select, .field textarea{
    width:100%; font-family:inherit; font-size:14.5px; color:var(--ink);
    background:var(--bg); border:1.5px solid var(--border); border-radius:10px;
    padding:12px 14px; min-height:46px; transition:border-color .15s ease, box-shadow .15s ease;
  }
  .field textarea{min-height:110px; resize:vertical;}
  .field input:focus, .field select:focus, .field textarea:focus{
    outline:none; border-color:var(--teal); box-shadow:0 0 0 3px rgba(45,166,178,0.15);
  }
  .field-error{font-size:12.5px; color:var(--danger); margin-top:6px; display:none;}
  .field.invalid input, .field.invalid select, .field.invalid textarea{border-color:var(--danger);}
  .field.invalid .field-error{display:block;}
  .field-hint{font-size:12px; color:var(--muted); margin-top:6px;}
  .form-success{
    display:none; align-items:center; gap:14px; padding:18px; border-radius:12px;
    background:rgba(51,177,94,0.1); border:1px solid rgba(51,177,94,0.3); margin-bottom:18px;
  }
  .form-success.show{display:flex;}
  .form-success svg{width:22px; height:22px; color:var(--green); flex-shrink:0;}
  .form-success strong{display:block; font-size:14px; margin-bottom:2px;}
  .form-success span{font-size:12.8px; color:var(--muted);}

  /* ---------- FAQ ---------- */
  .faq-list{max-width:760px; margin:0 auto; display:flex; flex-direction:column; gap:12px;}
  .faq-item{background:var(--card); border:1px solid var(--border); border-radius:14px; overflow:hidden;}
  .faq-q{
    width:100%; display:flex; align-items:center; justify-content:space-between; gap:16px;
    padding:18px 22px; background:none; border:none; cursor:pointer; text-align:left;
    font-size:15px; font-weight:600; color:var(--ink);
  }
  .faq-q svg{width:18px; height:18px; color:var(--teal); flex-shrink:0; transition:transform .25s ease;}
  .faq-item.open .faq-q svg{transform:rotate(45deg);}
  .faq-a{max-height:0; overflow:hidden; transition:max-height .3s ease;}
  .faq-a-in{padding:0 22px 20px; font-size:14px; color:var(--muted);}

  /* ---------- utility reveal ---------- */
  .reveal{opacity:0; transform:translateY(14px); transition:opacity .55s ease, transform .55s ease;}
  .reveal.in{opacity:1; transform:translateY(0);}
  @media (prefers-reduced-motion:reduce){
    .reveal{opacity:1; transform:none; transition:none;}
    .testi-slides{transition:none;}
  }

  .badge-soft{
    display:inline-flex; align-items:center; gap:6px; font-size:12px; font-weight:700;
    color:var(--teal); background:var(--grad-soft); padding:4px 10px; border-radius:999px;
  }

  .divider{height:1px; background:var(--border); margin-block:0;}

  [hidden]{display:none !important;}

  .center-text{text-align:center;}
  .mt-tight{margin-top:0;}
</style>
</head>
